<!doctype html>
<!--
  switchboard: the page a browser without a session sees at "/".

  It loads only the stylesheet: no script at all, so there is nothing to attack before sign-in.
  Signing in happens outside the browser: `switchboard login` in the user's own terminal prints a
  one-time link. This page never carries a token and never offers a form to type one into.
  Same rules as index.html: no inline script, style or event handler; every link is same-origin.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>switchboard &mdash; Sign in</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/favicon-32.png" sizes="32x32">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
</head>
<body class="login">
<main class="login-card" aria-labelledby="login-title">
  <div class="brand">
    <span class="brand-tile" aria-hidden="true">
      <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="4" cy="4" r="1.8"/><circle cx="12" cy="4" r="1.8"/><circle cx="12" cy="12" r="1.8"/><path d="M4 5.8V8a4 4 0 0 0 4 4h2.2M12 5.8v4.4"/></svg>
    </span>
    <span class="brand-name">switchboard</span>
  </div>
  <h1 id="login-title">Sign in this browser</h1>
  <p>This browser isn&rsquo;t signed in. In your own terminal, run:</p>
  <pre class="login-cmd"><code>switchboard login</code></pre>
  <p>and open the link it prints. Each link works once, for 5 minutes.</p>
  <p class="fine">If the broker isn&rsquo;t running yet, start it with <code>switchboard start</code>.</p>
  <div class="login-actions"><a class="btn-primary" href="/">Try again</a></div>
</main>
</body>
</html>
