<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>switchboard &mdash; Sign On</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="window dialog">
  <div class="titlebar">
    <span class="title-icon" aria-hidden="true">&#x1F511;</span>
    <span class="title-text">Sign On</span>
  </div>
  <div class="dialog-body">
    <p class="dialog-lead">Welcome to <b>switchboard</b>.</p>
    <p>This browser isn't signed in. In your own terminal, run:</p>
    <pre class="sunken cmd">switchboard login</pre>
    <p>and open the link it prints. Each link works once, for 5 minutes.</p>
    <p class="fine">If the broker isn't running yet, start it with <code>switchboard start</code>.</p>
    <p class="dialog-buttons"><a class="btn" href="/">Try Again</a></p>
  </div>
</div>
</body>
</html>
