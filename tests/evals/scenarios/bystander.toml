name = "bystander"
about = "The person asks alpha, who asks bravo and they trade messages: charlie, who was not asked, posts nothing."
room = "#build"
agents = ["alpha", "bravo", "charlie"]

[[steps]]
say = "@alpha ask @bravo to pick a number from 1 to 9, then tell me which one they picked."

# the premise: without the exchange, charlie's silence proves nothing
[[checks]]
id = "alpha_and_bravo_trade"
grader = "agents_post"
agents = ["alpha", "bravo"]

[[checks]]
id = "charlie_posts_nothing"
grader = "agents_do_not_post"
agents = ["charlie"]
