# uv 0.7.13 and its managed CPython 3.13, with the Python kept in the Actions cache (#667).
#
# Without the cache every job downloads CPython from astral-sh/python-build-standalone's GitHub
# releases, so one outage of release downloads turned every check red. The cache key is exactly
# what decides the bytes: the OS, the CPU, the uv version (which picks the CPython patch release)
# and the Python series. A hit makes the install run offline, so a stale cache fails loudly instead
# of quietly downloading. It is a `pull_request` cache: GitHub scopes it to the PR's own ref, and
# no workflow here uses `pull_request_target`, so a fork's PR can't write one that `main` reads.
# setup-uv's own cache (`cache-python: false`) keeps only uv's package cache; this step owns the Python.
name: uv and Python
description: Install uv 0.7.13 and CPython 3.13 (managed, cached by exact version)

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      with:
        version: "0.7.13"
    - name: Keep the managed Python in a directory the cache can name
      shell: bash
      run: echo "UV_PYTHON_INSTALL_DIR=$RUNNER_TEMP/uv-python" >> "$GITHUB_ENV"
    - id: cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
      with:
        path: ${{ runner.temp }}/uv-python
        key: uv-python-${{ runner.os }}-${{ runner.arch }}-uv0.7.13-cpython3.13
    - name: Install CPython 3.13
      shell: bash
      env:
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: |
        if [ "$CACHE_HIT" = true ]; then
          echo "python cache hit: installing CPython 3.13 offline, no download"
          uv python install --offline 3.13
        else
          echo "python cache miss: downloading CPython 3.13"
          uv python install 3.13 || { echo "::error::download failed: CPython 3.13 could not be fetched from GitHub releases (an outage, not a test failure); re-run the job later"; exit 1; }
        fi
        uv python find 3.13
