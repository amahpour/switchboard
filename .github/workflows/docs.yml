# The documentation site (#586): every push to main builds docs/ with Zensical (zensical.toml) and
# publishes it to GitHub Pages, https://amahpour.github.io/switchboard/. main takes only pull requests,
# and each one's `docs site` job (test.yml) has already built the same pages with --strict, so a merge
# that changes a doc changes the site within a few minutes. `gh workflow run docs.yml` republishes.
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false   # a publish in progress finishes; the next push publishes after it

jobs:
  publish:
    name: publish the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write      # upload and deploy the Pages artifact
      id-token: write   # deploy-pages proves the run with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: "0.7.13"
          python-version: "3.13"
          enable-cache: false   # a publishing job reads no cache another run could have written
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - run: uv run --frozen --only-group docs zensical build --strict --clean
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
