# Issue #101: reports on PRs and main. These jobs are not in test.yml's required CI aggregate.
# Findings are artifacts and job logs; nothing uploads to GitHub code scanning.
name: security reports

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: scan scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      scan: ${{ steps.scope.outputs.tests }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: scope
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            TITLE="$(git log -1 --pretty=%s | sed -E 's/ \(#[0-9]+\)$//')"
          fi
          git diff --name-only HEAD^1 HEAD | python3 .github/scripts/ci_scope.py --title "$TITLE"

  codeql:
    name: CodeQL (${{ matrix.language }}, report only)
    needs: scope
    if: needs.scope.outputs.scan == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          upload: never
          upload-database: false
          output: security-results/codeql
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: codeql-${{ matrix.language }}
          path: security-results/codeql/
          if-no-files-found: warn
          retention-days: 14

  bandit:
    name: Bandit (report only)
    needs: scope
    if: needs.scope.outputs.scan == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: "0.7.13"
          python-version: "3.13"
      - run: uv run --frozen python scripts/security_scan.py --only bandit --out security-results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: bandit-report
          path: security-results/
          if-no-files-found: warn
          retention-days: 14

  dependencies:
    name: Dependencies (report only)
    needs: scope
    if: needs.scope.outputs.scan == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: "0.7.13"
          python-version: "3.13"
      - run: uv run --frozen python scripts/security_scan.py --only dependencies --out security-results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: dependency-reports
          path: security-results/
          if-no-files-found: warn
          retention-days: 14

  image:
    name: Trivy image (report only)
    needs: scope
    if: needs.scope.outputs.scan == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          build-args: BUILD_COMMIT=${{ github.sha }}
          load: true
          tags: switchboard:security
          cache-from: type=gha,scope=image
      - run: mkdir -p security-results
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.75.0
          scan-type: image
          image-ref: switchboard:security
          format: json
          output: security-results/trivy.json
          exit-code: "0"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: trivy-image-report
          path: security-results/
          if-no-files-found: warn
          retention-days: 14

  zizmor:
    name: zizmor (report only)
    needs: scope
    if: needs.scope.outputs.scan == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: "0.7.13"
          python-version: "3.13"
      - run: uv run --frozen python scripts/security_scan.py --only zizmor --out security-results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: zizmor-report
          path: security-results/
          if-no-files-found: warn
          retention-days: 14

  gitleaks:
    name: gitleaks history (report only)
    needs: scope
    if: needs.scope.outputs.scan == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-pinned gitleaks v8.30.1
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full history, redacting any secrets in the artifact
        run: |
          mkdir -p security-results
          ./gitleaks git --redact=100 --report-format json --report-path security-results/gitleaks.json --exit-code 0 .
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = Path('security-results/gitleaks.json')
          findings = json.loads(report.read_text())
          for finding in findings:
              for key in ('Author', 'Email', 'Message'):
                  finding.pop(key, None)
          report.write_text(json.dumps(findings, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: gitleaks-report
          path: security-results/
          if-no-files-found: warn
          retention-days: 14
