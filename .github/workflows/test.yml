# Pull requests only (issue #46; CONTRIBUTING.md, "CI"): main takes only PRs whose `CI` check
# passed, so nothing re-runs the tests after a merge. Lint and static analysis, the default
# test suite (no live agent
# CLIs, no perf timings) on Linux and macOS, split into three shards per OS, with line coverage
# combined across all of them (the README badge, which release.yml publishes after the merge),
# the web UI in a real browser (Playwright, the `frontend` job), and the container image behind
# a TLS proxy (the `image` job). A docs-only PR and a release PR skip all that and run the tree
# scan alone. `CI`, the last job, sums it up for the ruleset. `gh workflow run test.yml` runs
# everything on a branch.
name: test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  # a newer push to a PR cancels its older run
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What the PR changes (.github/scripts/ci_scope.py): the test jobs below run unless every
  # file is docs, or the PR is a release PR (`release: vX.Y.Z`, changing only what a release
  # writes). A manual run always tests. It fails a PR that edits CHANGELOG.md: only a release
  # writes it, and a PR's notes go in changes/<name>.md.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      tests: ${{ steps.scope.outputs.tests }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 2   # the PR's merge commit and main as it is now (its first parent)
      - id: scope
        env:
          TITLE: ${{ github.event.pull_request.title }}   # untrusted text: through the environment, never pasted into the script
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "tests=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git diff --name-only HEAD^1 HEAD | python3 .github/scripts/ci_scope.py --title "$TITLE"

  # For the PRs that skip the tests: the tree scan alone (tests/unit/test_tree_scan.py), which
  # keeps local machine details (home paths, scratch dirs) out of the public repo.
  docs:
    name: tree scan
    needs: changes
    if: needs.changes.outputs.tests == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: "0.7.13"
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q -p no:cacheprovider tests/unit/test_tree_scan.py

  lint:
    name: lint and static analysis
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: "0.7.13"
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/lint.py --base HEAD^1

  test:
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    name: pytest (${{ matrix.os }}, ${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Three runners per OS, each running a third of the suite with xdist on its cores. A
        # hosted runner has only 3-4 cores, and more xdist workers than cores doesn't pay (each
        # worker imports and collects the whole suite), so more runners is what shortens the run.
        # pytest-split balances the thirds by the durations in .test_durations (CONTRIBUTING.md);
        # `--splits` below must match this list's length. Locally, run the suite whole (-n auto).
        shard: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # uv's standalone CPython, not the runner's python.org framework build (which
      # re-execs itself as Python.app, so a symlinked `claude` stand-in loses its name)
      UV_PYTHON_PREFERENCE: only-managed
      # the web UI's node tests (tests/unit/test_web_app_behavior.py, test_web_markdown.py)
      # skip where node is missing; here a missing node fails the run instead
      SWITCHBOARD_REQUIRE_NODE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: "0.7.13"          # pyproject.toml: [tool.uv] required-version
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      - name: lsof (the Codex client check and a bind test use it)
        if: runner.os == 'Linux'
        run: command -v lsof || (sudo apt-get update && sudo apt-get install -y --no-install-recommends lsof)
      # The `ssh` tier (tests/integration/test_remote_ssh.py) runs a user-level sshd on 127.0.0.1
      # (tests/fakes/sshd.py); macOS runners have /usr/sbin/sshd already
      - name: OpenSSH server and client, rsync (the ssh tier)
        if: runner.os == 'Linux'
        run: |
          if [ -x /usr/sbin/sshd ] && command -v ssh >/dev/null && command -v rsync >/dev/null; then exit 0; fi
          sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-server openssh-client rsync
      - run: uv sync --frozen
      # pyproject's addopts deselect `live` (real agent CLIs) and `perf` (timing targets).
      # --cov measures this process and ([tool.coverage.run] patch) its Python children.
      # -n auto: pytest-xdist runs this shard on every core; pytest-cov merges the workers.
      # --splits/--group: this runner's third of the suite (pytest-split, least_duration balances
      # the recorded durations; a test not in .test_durations counts as the average one).
      - run: >-
          uv run --frozen pytest -q -p no:cacheprovider -n auto
          --splits 3 --group ${{ matrix.shard }} --splitting-algorithm least_duration
          --cov --cov-report=term
      - name: Keep this shard's coverage data for the combine job
        run: |
          mkdir coverage-data
          mv .coverage "coverage-data/.coverage.${{ matrix.os }}-${{ matrix.shard }}"   # pytest-cov's merge of this run
          # a child that exited after pytest-cov merged leaves its own .coverage.<host>.<pid>.<n>
          for f in .coverage.*; do if [ -e "$f" ]; then mv "$f" coverage-data/; fi; done
          ls -la coverage-data
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-data-${{ matrix.os }}-${{ matrix.shard }}
          path: coverage-data/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Two hosts in containers (DESIGN.md §27.13 T2, docs/SANDBOX.md §11): a desktop and a fake
  # remote machine on an internal network, paired for real, with the production ssh link
  # between them and stand-in agents on both sides. Not part of the coverage figure.
  twohost:
    name: two hosts (containers)
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: "0.7.13"
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Build the two-host image
        run: docker compose -f sandbox/twohost/compose.yaml --profile test build
      # the tests start the containers under a project name of their own and remove them after
      - run: uv run --frozen pytest -q -p no:cacheprovider -m twohost tests/twohost

  # The web UI in headless Chromium (Playwright): tests/e2e against a seeded test-mode broker
  # (marker `e2e`, deselected from the default run above), then docs/media/ui_shots.py into a
  # temp dir. The screenshots, and any failed test's trace and screenshots, are uploaded as
  # one artifact, pass or fail. Not part of the coverage figure.
  frontend:
    name: frontend (Playwright)
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON_PREFERENCE: only-managed
      SWITCHBOARD_REQUIRE_NODE: "1"
      SWITCHBOARD_E2E_ARTIFACTS: ${{ github.workspace }}/frontend-artifacts/e2e
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: "0.7.13"
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      - run: uv sync --frozen
      # the Chromium build that matches the locked playwright, plus its system libraries
      - run: uv run --frozen playwright install --with-deps chromium
      - run: uv run --frozen pytest -q -p no:cacheprovider -m e2e tests/e2e
      - name: Screenshots (docs/media/ui_shots.py, into the artifact rather than the tree)
        if: success() || failure()
        run: uv run --frozen python docs/media/ui_shots.py --out frontend-artifacts/screenshots
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: frontend-artifacts
          path: frontend-artifacts/
          if-no-files-found: warn
          retention-days: 7

  # The container image (issue #34; docs/DEPLOY.md), built from this tree for linux/amd64 and
  # run as a platform runs it: behind a proxy that terminates TLS (tests/image, marker `image`,
  # deselected from the default run). /healthz, `docker exec … switchboard login`, the UI in
  # Chromium over https and wss, a clean `docker stop`, the data across a restart, and the
  # volumes Render and Kubernetes mount. The UI's screenshot is uploaded. Not part of coverage.
  # A release publishes the image for both architectures (release.yml's `publish-image`).
  image:
    name: image (behind a TLS proxy)
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON_PREFERENCE: only-managed
      SWITCHBOARD_IMAGE: switchboard:ci
      SWITCHBOARD_E2E_ARTIFACTS: ${{ github.workspace }}/image-artifacts
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: "0.7.13"
          python-version: "3.13"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build the image (linux/amd64, into the runner's Docker)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          build-args: BUILD_COMMIT=${{ github.sha }}
          load: true
          tags: switchboard:ci
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
      - run: uv sync --frozen
      - run: uv run --frozen playwright install --with-deps chromium
      - run: uv run --frozen pytest -q -p no:cacheprovider -m image tests/image
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: image-artifacts
          path: image-artifacts/
          if-no-files-found: warn
          retention-days: 7

  # Combines every shard's data (both OSes), prints the report, enforces the ratchet and writes the
  # shields.io endpoint JSON. Read-only: after the merge, release.yml's `badge` job publishes it.
  coverage:
    name: coverage (combined)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON_PREFERENCE: only-managed
      # The ratchet: combined line coverage may not drop below this. It started at
      # floor(93.64%, the combined figure when coverage came in) - 3, so work in flight
      # isn't blocked. Then floor(96.63%, macOS with the delivery, adapter, broker, hook
      # and installer coverage tests) - 3, as M8 was still landing. Raise it as coverage
      # improves (CONTRIBUTING.md, "Coverage"); never lower it to get a PR through.
      COVERAGE_FLOOR: "93"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: "0.7.13"
          python-version: "3.13"
      - run: uv sync --frozen
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: coverage-data-*
          path: coverage-data
          merge-multiple: true
      - name: Combine
        run: |
          ls -la coverage-data
          uv run --frozen coverage combine coverage-data
      - name: Report (fails under the ratchet)
        run: uv run --frozen coverage report --fail-under="$COVERAGE_FLOOR"
      - name: Badge JSON (shields.io endpoint)
        run: |
          uv run --frozen coverage json -o coverage-full.json
          uv run --frozen python - <<'EOF'
          import json, math
          pct = json.load(open("coverage-full.json"))["totals"]["percent_covered"]
          whole = math.floor(pct)  # never round up to a coverage the code doesn't have
          color = next(c for floor, c in ((95, "brightgreen"), (90, "green"), (80, "yellowgreen"),
                                          (70, "yellow"), (60, "orange"), (0, "red")) if whole >= floor)
          badge = {"schemaVersion": 1, "label": "coverage", "message": f"{whole}%", "color": color}
          json.dump(badge, open("coverage.json", "w"))
          print(f"combined line coverage {pct:.2f}% -> badge {badge}")
          EOF
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-badge
          path: coverage.json
          if-no-files-found: error
          retention-days: 7

  # The check the ruleset on main requires (CONTRIBUTING.md, "CI"). A job skipped by its `if`
  # reports success, but a check that never starts leaves a PR waiting forever, so this job
  # always runs and judges the rest: `what changed` passed, and then either lint and every test job
  # passed or (docs only, a release PR) the tree scan did.
  ci:
    name: CI
    needs: [changes, docs, lint, test, twohost, frontend, image, coverage]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          for job, n in needs.items():
              print(f"{job}: {n['result']}")
          tests = needs["changes"].get("outputs", {}).get("tests")
          if needs["changes"]["result"] != "success" or tests not in ("true", "false"):
              sys.exit("`what changed` didn't decide whether to run the tests")
          want = ("lint", "test", "twohost", "frontend", "image", "coverage") if tests == "true" else ("docs",)
          if failed := [job for job in want if needs[job]["result"] != "success"]:
              sys.exit(f"not passed: {', '.join(failed)}")
          print("tests ran and passed" if tests == "true" else "tests skipped (docs only or a release PR); tree scan passed")
          EOF
