# The default test suite (no live agent CLIs, no perf timings) on Linux and macOS.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # uv's standalone CPython, not the runner's python.org framework build (which
      # re-execs itself as Python.app, so a symlinked `claude` stand-in loses its name)
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: "0.7.13"          # pyproject.toml: [tool.uv] required-version
          python-version: "3.13"
      - name: lsof (the Codex client check and a bind test use it)
        if: runner.os == 'Linux'
        run: command -v lsof || (sudo apt-get update && sudo apt-get install -y --no-install-recommends lsof)
      - run: uv sync --frozen
      # pyproject's addopts deselect `live` (real agent CLIs) and `perf` (timing targets)
      - run: uv run --frozen pytest -q -p no:cacheprovider
