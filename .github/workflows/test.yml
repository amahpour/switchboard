# The default test suite (no live agent CLIs, no perf timings) on Linux and macOS,
# with line coverage combined across both and published as the README badge, and the
# web UI in a real browser (Playwright, the `frontend` job).
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # uv's standalone CPython, not the runner's python.org framework build (which
      # re-execs itself as Python.app, so a symlinked `claude` stand-in loses its name)
      UV_PYTHON_PREFERENCE: only-managed
      # the web UI's node tests (tests/unit/test_web_app_behavior.py, test_web_markdown.py)
      # skip where node is missing; here a missing node fails the run instead
      SWITCHBOARD_REQUIRE_NODE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: "0.7.13"          # pyproject.toml: [tool.uv] required-version
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      - name: lsof (the Codex client check and a bind test use it)
        if: runner.os == 'Linux'
        run: command -v lsof || (sudo apt-get update && sudo apt-get install -y --no-install-recommends lsof)
      # The `ssh` tier (tests/integration/test_remote_ssh.py) runs a user-level sshd on 127.0.0.1
      # (tests/fakes/sshd.py); macOS runners have /usr/sbin/sshd already
      - name: OpenSSH server and client, rsync (the ssh tier)
        if: runner.os == 'Linux'
        run: |
          if [ -x /usr/sbin/sshd ] && command -v ssh >/dev/null && command -v rsync >/dev/null; then exit 0; fi
          sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-server openssh-client rsync
      - run: uv sync --frozen
      # pyproject's addopts deselect `live` (real agent CLIs) and `perf` (timing targets).
      # --cov measures this process and ([tool.coverage.run] patch) its Python children.
      # -n auto: pytest-xdist runs the suite on every core (about 3x faster); pytest-cov merges the workers
      - run: uv run --frozen pytest -q -p no:cacheprovider -n auto --cov --cov-report=term
      - name: Keep this OS's coverage data for the combine job
        run: |
          mkdir coverage-data
          mv .coverage "coverage-data/.coverage.${{ matrix.os }}"   # pytest-cov's merge of this run
          # a child that exited after pytest-cov merged leaves its own .coverage.<host>.<pid>.<n>
          for f in .coverage.*; do if [ -e "$f" ]; then mv "$f" coverage-data/; fi; done
          ls -la coverage-data
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-data-${{ matrix.os }}
          path: coverage-data/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Two hosts in containers (DESIGN.md §27.13 T2, docs/SANDBOX.md §11): a desktop and a fake
  # remote machine on an internal network, paired for real, with the production ssh link
  # between them and stand-in agents on both sides. Not part of the coverage figure.
  twohost:
    name: two hosts (containers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: "0.7.13"
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Build the two-host image
        run: docker compose -f sandbox/twohost/compose.yaml --profile test build
      # the tests start the containers under a project name of their own and remove them after
      - run: uv run --frozen pytest -q -p no:cacheprovider -m twohost tests/twohost

  # The web UI in headless Chromium (Playwright): tests/e2e against a seeded test-mode broker
  # (marker `e2e`, deselected from the default run above), then docs/media/ui_shots.py into a
  # temp dir. The screenshots, and any failed test's trace and screenshots, are uploaded as
  # one artifact, pass or fail. Not part of the coverage figure.
  frontend:
    name: frontend (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON_PREFERENCE: only-managed
      SWITCHBOARD_REQUIRE_NODE: "1"
      SWITCHBOARD_E2E_ARTIFACTS: ${{ github.workspace }}/frontend-artifacts/e2e
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: "0.7.13"
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      - run: uv sync --frozen
      # the Chromium build that matches the locked playwright, plus its system libraries
      - run: uv run --frozen playwright install --with-deps chromium
      - run: uv run --frozen pytest -q -p no:cacheprovider -m e2e tests/e2e
      - name: Screenshots (docs/media/ui_shots.py, into the artifact rather than the tree)
        if: success() || failure()
        run: uv run --frozen python docs/media/ui_shots.py --out frontend-artifacts/screenshots
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: frontend-artifacts
          path: frontend-artifacts/
          if-no-files-found: warn
          retention-days: 7

  # Combines both OSes' data, prints the report, enforces the ratchet and writes the
  # shields.io endpoint JSON. Read-only: only the `badge` job below can push.
  coverage:
    name: coverage (combined)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON_PREFERENCE: only-managed
      # The ratchet: combined line coverage may not drop below this. It started at
      # floor(93.64%, the combined figure when coverage came in) - 3, so work in flight
      # isn't blocked. Then floor(96.63%, macOS with the delivery, adapter, broker, hook
      # and installer coverage tests) - 3, as M8 was still landing. Raise it as coverage
      # improves (CONTRIBUTING.md, "Coverage"); never lower it to get a PR through.
      COVERAGE_FLOOR: "93"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: "0.7.13"
          python-version: "3.13"
      - run: uv sync --frozen
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: coverage-data-*
          path: coverage-data
          merge-multiple: true
      - name: Combine
        run: |
          ls -la coverage-data
          uv run --frozen coverage combine coverage-data
      - name: Report (fails under the ratchet)
        run: uv run --frozen coverage report --fail-under="$COVERAGE_FLOOR"
      - name: Badge JSON (shields.io endpoint)
        run: |
          uv run --frozen coverage json -o coverage-full.json
          uv run --frozen python - <<'EOF'
          import json, math
          pct = json.load(open("coverage-full.json"))["totals"]["percent_covered"]
          whole = math.floor(pct)  # never round up to a coverage the code doesn't have
          color = next(c for floor, c in ((95, "brightgreen"), (90, "green"), (80, "yellowgreen"),
                                          (70, "yellow"), (60, "orange"), (0, "red")) if whole >= floor)
          badge = {"schemaVersion": 1, "label": "coverage", "message": f"{whole}%", "color": color}
          json.dump(badge, open("coverage.json", "w"))
          print(f"combined line coverage {pct:.2f}% -> badge {badge}")
          EOF
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-badge
          path: coverage.json
          if-no-files-found: error
          retention-days: 7

  # Push to main only: commits coverage.json to the orphan `badges` branch (created
  # on first use), which the README badge reads through shields.io.
  badge:
    name: publish badge
    needs: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: coverage-badge
          path: badge-in
      - name: Commit coverage.json to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          b64=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$b64"
          auth="AUTHORIZATION: basic $b64"   # the way actions/checkout authenticates; never stored in a config
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          git init -q -b badges badges && cd badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git -c http.extraheader="$auth" ls-remote --exit-code --heads "$remote" badges >/dev/null; then
            git -c http.extraheader="$auth" fetch -q --depth 1 "$remote" badges
            git checkout -q -B badges FETCH_HEAD
          else
            rc=$?; [ "$rc" -eq 2 ] || exit "$rc"   # 2: no badges branch yet, so start it (orphan: none of main's history)
          fi
          cp ../badge-in/coverage.json coverage.json
          git add coverage.json
          if git diff --cached --quiet; then
            echo "coverage.json unchanged"; exit 0
          fi
          git commit -q -m "coverage: $(python3 -c 'import json; print(json.load(open("coverage.json"))["message"])') (${GITHUB_SHA::7})"
          git -c http.extraheader="$auth" push -q "$remote" HEAD:refs/heads/badges
          cat coverage.json
