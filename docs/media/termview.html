<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>terminal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@500;600&display=block">
<style>
  html, body { margin: 0; height: 100%; background: #111316; overflow: hidden; }
  #win { position: absolute; inset: 0; display: flex; flex-direction: column; background: #16181b; }
  #bar { height: 44px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 18px;
         background: #1d2024; border-bottom: 1px solid #2a2e33;
         font: 600 16px Inter, "Noto Sans", sans-serif; color: #d6d9dd; letter-spacing: .1px; }
  #av { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center;
        font: 700 12px Inter, "Noto Sans", sans-serif; }
  #sub { color: #8b9097; font-weight: 500; }
  #term { flex: 1; padding: 16px 22px 10px 22px; }
  .xterm .xterm-viewport { overflow: hidden !important; background: #16181b !important; }
</style>
</head>
<body>
<div id="win">
  <div id="bar"><div id="av"></div><span id="name"></span><span id="sub"></span></div>
  <div id="term"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script>
const q = new URLSearchParams(location.search);
const who = q.get('name'), cols = +q.get('cols'), rows = +q.get('rows'), port = q.get('port');
const look = {
  claude: {av: 'CC', bg: '#43291f', fg: '#e8875f', name: 'claude-1', sub: 'Claude Code'},
  codex:  {av: 'CX', bg: '#1b2e45', fg: '#6aa8ff', name: 'codex-1', sub: 'Codex'},
}[who];
document.getElementById('av').textContent = look.av;
document.getElementById('av').style.background = look.bg;
document.getElementById('av').style.color = look.fg;
document.getElementById('name').textContent = look.name;
document.getElementById('sub').textContent = look.sub;
document.fonts.load('20px "JetBrains Mono"').then(() => document.fonts.load('700 20px "JetBrains Mono"')).then(() => {
  const term = new Terminal({
    cols, rows, fontSize: 20, lineHeight: 1.0, fontFamily: '"JetBrains Mono", "DejaVu Sans Mono", monospace',
    cursorBlink: false, cursorStyle: 'bar', cursorInactiveStyle: 'none', allowProposedApi: true, scrollback: 0,
    theme: {
      background: '#16181b', foreground: '#dfe2e6', cursor: '#16181b', cursorAccent: '#16181b',
      selectionBackground: '#33373d',
      black: '#23262b', red: '#e8736b', green: '#97c378', yellow: '#dcb56a', blue: '#6aa8ff',
      magenta: '#c68ae0', cyan: '#5fc0cc', white: '#c9cdd3',
      brightBlack: '#6b717a', brightRed: '#ff8a80', brightGreen: '#a9d68b', brightYellow: '#ecc77a',
      brightBlue: '#8cbcff', brightMagenta: '#d7a1ee', brightCyan: '#7fd3dd', brightWhite: '#f5f6f7',
    },
  });
  const box = document.getElementById('term');
  term.open(box);
  // the largest font at which cols x rows cells fit the window
  const cs = getComputedStyle(box);
  const availW = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const availH = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  for (let s = 28; s >= 10; s -= 0.5) {
    term.options.fontSize = s;
    const c = term._core._renderService.dimensions.css.cell;
    if (c.width * cols <= availW && c.height * rows <= availH) break;
  }
  const c = term._core._renderService.dimensions.css.cell, r = box.getBoundingClientRect();
  window.__cell = {w: c.width, h: c.height, x: r.left + parseFloat(cs.paddingLeft),
                   y: r.top + parseFloat(cs.paddingTop), font: term.options.fontSize};
  const ws = new WebSocket(`ws://127.0.0.1:${port}/${who}?cols=${cols}&rows=${rows}`);
  ws.binaryType = 'arraybuffer';
  ws.onmessage = ev => term.write(new Uint8Array(ev.data));
  window.__ready = true;
});
</script>
</body>
</html>
