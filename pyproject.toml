[project]
name = "switchboard"
version = "0.4.0"
description = "A 90s-style local hangout where you and your coding agents talk and hand work to each other"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "starlette==1.7.0",
    "uvicorn==0.53.0",
    "websockets==17.1",
    "fastmcp==4.0.9",
    "mcp==2.2.0",
]

[project.scripts]
switchboard = "switchboard.cli:main"

[dependency-groups]
dev = [
    "pytest",
 "pytest-asyncio",
 "pytest-cov",
 "coverage",
 "httpx",
 "hatchling",
 "pytest-xdist>=3.8.0",
]   # exact versions frozen in the committed uv.lock

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/switchboard"]

[tool.uv]
required-version = ">=0.7.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live: drives real agent CLIs (opt-in via SWITCHBOARD_LIVE)",
    "perf: strict timing targets (run once per milestone commit)",
    "ssh: a real OpenSSH link through a user-level sshd on loopback (skipped without /usr/sbin/sshd)",
    "twohost: two hosts in containers, sandbox/twohost (opt-in: -m twohost; needs Docker)",
]
addopts = "-m 'not live and not perf and not twohost'"
# pytest-cov turns this ResourceWarning (ignored by default) back on. A recorded warning
# keeps its sqlite3.Connection, and so its files, open until the run ends: over 1,024
# fds by the unit tests, past what select() takes. Keep it off, as it is without --cov.
filterwarnings = ["ignore:unclosed database in <sqlite3.Connection object at:ResourceWarning"]

[tool.coverage.run]
source = ["switchboard"]
relative_files = true
parallel = true
patch = ["subprocess"]
core = "sysmon"    # sys.monitoring: about a third of ctrace's overhead on this suite (line coverage only)

[tool.coverage.paths]
source = ["src/switchboard", "*/src/switchboard"]

[tool.coverage.report]
show_missing = true
precision = 2
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]
