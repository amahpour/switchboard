[project]
name = "switchboard-chat"
version = "0.21.1"
description = "A local group chat where you and your coding agents talk and hand work to each other"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["coding agents", "claude code", "codex", "cursor", "devin", "mcp", "group chat"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "fastapi==0.141.1",
    "starlette==1.7.0",
    "uvicorn==0.53.0",
    "websockets==17.1",
    "fastmcp==4.0.9",
    "mcp==2.2.0",
    "fido2==2.2.1",
    "cryptography==50.0.1",
    "truststore==0.10.4",
]

[project.urls]
Homepage = "https://github.com/amahpour/switchboard"
Documentation = "https://github.com/amahpour/switchboard/blob/main/docs/USAGE.md"
Changelog = "https://github.com/amahpour/switchboard/blob/main/CHANGELOG.md"
Issues = "https://github.com/amahpour/switchboard/issues"

[project.scripts]
switchboard = "switchboard.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "coverage",
    "httpx",
    "hatchling",
    "pytest-xdist>=3.8.0",
    "playwright>=1.63.0",
    "pytest-playwright>=0.9.0",
    "pytest-split>=0.10",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
]   # exact versions frozen in the committed uv.lock

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/switchboard"]

# the sdist builds the wheel and nothing more: not the screenshots, the docs or the tests (#233)
[tool.hatch.build.targets.sdist]
include = ["/src/switchboard", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.uv]
required-version = ">=0.7.13"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
# Existing findings are pinned by file, rule and source in .lint-baseline.json.
# New violations fail; the baseline may only shrink.
select = ["E4", "E7", "E9", "E501", "F", "I", "B"]

[tool.mypy]
python_version = "3.13"
files = ["src/switchboard"]
show_error_codes = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live: drives real agent CLIs (opt-in via SWITCHBOARD_LIVE)",
    "perf: strict timing targets (run once per milestone commit)",
    "ssh: a real OpenSSH link through a user-level sshd on loopback (skipped without /usr/sbin/sshd)",
    "twohost: two hosts in containers, sandbox/twohost (opt-in: -m twohost; needs Docker)",
    "e2e: the web UI in a real browser through Playwright, tests/e2e (opt-in: -m e2e; needs `playwright install chromium`)",
    "image: the container image behind a TLS proxy, tests/image (opt-in: -m image; needs Docker and Playwright's Chromium)",
]
addopts = "-m 'not live and not perf and not twohost and not e2e and not image'"
# pytest-cov turns this ResourceWarning (ignored by default) back on. A recorded warning
# keeps its sqlite3.Connection, and so its files, open until the run ends: over 1,024
# fds by the unit tests, past what select() takes. Keep it off, as it is without --cov.
filterwarnings = ["ignore:unclosed database in <sqlite3.Connection object at:ResourceWarning"]

[tool.coverage.run]
source = ["switchboard"]
relative_files = true
parallel = true
patch = ["subprocess"]
core = "sysmon"    # sys.monitoring: about a third of ctrace's overhead on this suite (line coverage only)

[tool.coverage.paths]
source = ["src/switchboard", "*/src/switchboard"]

[tool.coverage.report]
show_missing = true
precision = 2
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]
