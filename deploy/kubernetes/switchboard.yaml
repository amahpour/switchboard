# switchboard on Kubernetes (docs/DEPLOY.md): EKS, GKE, AKS or any cluster with a default
# StorageClass and an ingress controller that terminates TLS.
#
#   kubectl create namespace switchboard
#   kubectl -n switchboard apply -f deploy/kubernetes/switchboard.yaml    # after editing sb.example.com
#   kubectl -n switchboard logs switchboard-0    # the claim link (docs/DEPLOY.md)
#
# One broker, one volume: a StatefulSet with a single replica and a ReadWriteOnce claim.
# Never scale it up; the broker's lock refuses a second one on the same volume, and several
# brokers are a different design (issue #35). A StatefulSet replaces its one pod by stopping it
# before starting the new one, which is what a Deployment's `Recreate` strategy would do.
# The volume must be a block device (EBS, a GCE persistent disk, Azure Disk), never NFS or EFS:
# SQLite's locking isn't reliable there.
#
# To follow live calls (meetings), patch a second container into this pod: see meetings/ in this
# folder and docs/DEPLOY.md, "Meetings on Kubernetes". Nothing here changes without it.
apiVersion: v1
kind: Service
metadata:
  name: switchboard
  labels:
    app.kubernetes.io/name: switchboard
spec:
  selector:
    app.kubernetes.io/name: switchboard
  ports:
    - name: http
      port: 7419
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: switchboard
  labels:
    app.kubernetes.io/name: switchboard
spec:
  serviceName: switchboard
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: switchboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: switchboard
    spec:
      # Kubernetes gives every pod a variable per Service in its namespace, and this Service is named
      # switchboard: SWITCHBOARD_PORT=tcp://<cluster-ip>:7419 overrides the image's SWITCHBOARD_PORT=7419,
      # and the broker would refuse it as its port and crash-loop (#595). It reads none of them.
      enableServiceLinks: false
      securityContext:
        runAsUser: 10001        # the image's `switchboard` user, from the start
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001          # makes the volume writable by that user...
        fsGroupChangePolicy: OnRootMismatch   # ...without re-chmodding the broker's private home on every start
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: switchboard
          image: ghcr.io/amahpour/switchboard:1.13.0   # a release, not :latest (docs/DEPLOY.md, "Upgrading")
          env:
            - name: SWITCHBOARD_PUBLIC_URL
              value: https://sb.example.com      # the Ingress host below; the broker answers to no other
            - name: SWITCHBOARD_HUMAN_NAME
              value: alice                       # the admin's name in the rooms (sign in as it, or as admin)
          ports:
            - name: http
              containerPort: 7419
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
# Your ingress controller terminates TLS for the public URL and passes the browser's Host and
# Origin through (ingress-nginx and most others do by default). The UI's WebSocket needs no
# timeout annotation: the broker pings it every 20 seconds. An agent over HTTPS does: Claude Code's
# listener waits up to 15 minutes in silence at /mcp/listen, and ingress-nginx closes a quiet
# request after 60 seconds unless told otherwise. The TLS secret is yours, or cert-manager's (add
# its cluster-issuer annotation).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: switchboard
  labels:
    app.kubernetes.io/name: switchboard
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "960"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "960"
    # one megabyte over [files] max_mb (25). ingress-nginx's default cuts a body at 1m.
    nginx.ingress.kubernetes.io/proxy-body-size: "26m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["sb.example.com"]
      secretName: switchboard-tls
  rules:
    - host: sb.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: switchboard
                port:
                  name: http

