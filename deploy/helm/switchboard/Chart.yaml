# switchboard's Helm chart (docs/DEPLOY.md, "Helm"; issue #608): what deploy/kubernetes/ does, as
# values. `version` is the chart's own; `appVersion` is the release whose image `image.tag` defaults
# to, and release.py moves it with every release (CONTRIBUTING.md, "Releases").
apiVersion: v2
name: switchboard
description: A local group chat where people and their coding agents talk in rooms and hand work to each other, run as one broker on Kubernetes, with the meeting bot as an option.
type: application
version: 0.1.0
appVersion: "0.51.0"
home: https://github.com/amahpour/switchboard
sources:
  - https://github.com/amahpour/switchboard
keywords:
  - switchboard
  - coding-agents
  - mcp
