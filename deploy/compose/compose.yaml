# switchboard on one machine with Docker Compose (docs/DEPLOY.md): the broker, and Caddy in
# front of it terminating TLS with a certificate from Let's Encrypt for your domain. Any VM with
# Docker and a DNS name pointing at it, ports 80 and 443 open.
#
#   export SWITCHBOARD_DOMAIN=sb.example.com
#   docker compose -f deploy/compose/compose.yaml up -d
#   docker compose -f deploy/compose/compose.yaml logs switchboard    # the claim link (docs/DEPLOY.md)
#
# The broker's data is the `switchboard-data` volume (/data in the container). One broker per
# volume: its lock refuses a second one, so never scale this service past 1.
#
# Meetings (docs/DEPLOY.md, "A meeting bot"): the `meetings` profile adds joinly, the bot that
# follows a call. Put these two lines in a `.env` file beside this one, then `up -d` as above:
#
#   COMPOSE_PROFILES=meetings
#   SWITCHBOARD_JOINLY_URL=http://joinly:8000/mcp/
#
# Each live call takes about 2.7 GiB and 1 CPU on this machine.
#
# Meetings on an NVIDIA GPU: the `meetings-gpu` profile instead of `meetings`, a second service (joinly-gpu)
# for the same bot on joinly's CUDA image. Needs the NVIDIA driver and the NVIDIA Container Toolkit on the
# host. The model worth a GPU is large-v3-turbo; the first call downloads it (about 1.6 GB), so fetch it
# before (docs/DEPLOY.md, "The speech model, and a GPU"). The `.env` file:
#
#   COMPOSE_PROFILES=meetings-gpu
#   SWITCHBOARD_JOINLY_URL=http://joinly-gpu:8000/mcp/
#   SWITCHBOARD_MEETING_STT_MODEL=large-v3-turbo
name: switchboard

services:
  switchboard:
    image: ghcr.io/amahpour/switchboard:1.1.0   # a release, not :latest (docs/DEPLOY.md, "Upgrading")
    restart: unless-stopped
    environment:
      # the address browsers use; the broker answers to no other
      SWITCHBOARD_PUBLIC_URL: https://${SWITCHBOARD_DOMAIN:?set SWITCHBOARD_DOMAIN to your DNS name}
      # the admin's name in the rooms (sign in as it, or as admin); unset, it is `me`
      SWITCHBOARD_HUMAN_NAME: ${SWITCHBOARD_HUMAN_NAME:-}
      # where the meeting bot listens (the `meetings` profile below); unset, /meeting says how to set it up
      SWITCHBOARD_JOINLY_URL: ${SWITCHBOARD_JOINLY_URL:-}
      # the speech-to-text model: base, small, distil-large-v3 or large-v3-turbo (anything else stops the broker
      # at start). Unset, joinly uses the model its image holds. A name is downloaded on the first call.
      SWITCHBOARD_MEETING_STT_MODEL: ${SWITCHBOARD_MEETING_STT_MODEL:-}
    volumes:
      - switchboard-data:/data
    # no `ports:`: only Caddy reaches it, over this project's network
    stop_grace_period: 20s

  # The meeting bot, only with the `meetings` profile. It has no sign-in and takes its settings from whoever
  # connects, so it publishes no port: only the broker reaches it, as http://joinly:8000/mcp/ on this
  # project's network.
  joinly:
    image: ghcr.io/joinly-ai/joinly:v0.5.4@sha256:d19ca294eb24625d69d8069d0168cb5214af3652fbf721eb07480177eb4b9ea0   # the tag DEPLOY.md runs; 3.7 GB, so the first pull takes a while
    profiles: [meetings]
    restart: unless-stopped
    shm_size: "1gb"   # Chromium's shared memory; Docker's default 64 MB is known to crash it
    # Two fixes to joinly 0.5.4 are not in a release yet. Zoom shows no speaker names without the first
    # (joinly-ai/joinly#187), and a call line sometimes loses its first word without the second (#620). For
    # either, download its pinned file beside this one as DEPLOY.md says, then uncomment its line (a missing
    # file would stop the bot):
    # volumes:
    #   - ./zoom.py:/app/.venv/lib/python3.12/site-packages/joinly/providers/browser/platforms/zoom.py:ro
    #   - ./transcription.py:/app/.venv/lib/python3.12/site-packages/joinly/controllers/transcription/default.py:ro
    # And the voice patch (#713), two files of this repository that let `speak_text` take a voice for one line:
    # put them in a folder `joinly/` beside this file (DEPLOY.md, "A voice for each line") and uncomment:
    #   - ./joinly/server.py:/app/.venv/lib/python3.12/site-packages/joinly/server.py:ro
    #   - ./joinly/kokoro.py:/app/.venv/lib/python3.12/site-packages/joinly/services/tts/kokoro.py:ro
    # A model you name in SWITCHBOARD_MEETING_STT_MODEL is downloaded into the container, and gone when the
    # container is made again. To keep it, mount a volume at joinly's cache under `volumes:` (and declare
    # `joinly-models:` in the top-level `volumes:` below), only for a model you name: it hides the model the
    # image holds. DEPLOY.md, "The speech model, and a GPU", has the command that fetches it first.
    #   - joinly-models:/home/app/.cache/huggingface

  # The same bot on one NVIDIA GPU, only with the `meetings-gpu` profile: joinly's CUDA build of the same
  # release (about 6 GB). It sets its own device (JOINLY_DEVICE=cuda in the image), so nothing else is needed
  # here. It is a service of its own, so the broker's address is http://joinly-gpu:8000/mcp/. Turn on one of the
  # two profiles, not both. As for the CPU bot, it publishes no port: only the broker reaches it.
  joinly-gpu:
    image: ghcr.io/joinly-ai/joinly:v0.5.4-cuda@sha256:cc79e10311f95252d7684c4969c4467ea581c78de9b331096ac27a4a5a98532e   # the `meetings` release with CUDA; move both together
    profiles: [meetings-gpu]
    restart: unless-stopped
    shm_size: "1gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # The same optional mounts as above (the two fixes, and a volume to keep a model you name), written
    # out for this service the same way. For the cache use a volume of its own (`joinly-gpu-models`): the
    # CUDA image holds a different default model than the CPU one.
    # volumes:
    #   - ./zoom.py:/app/.venv/lib/python3.12/site-packages/joinly/providers/browser/platforms/zoom.py:ro
    #   - ./transcription.py:/app/.venv/lib/python3.12/site-packages/joinly/controllers/transcription/default.py:ro
    #   - ./joinly/server.py:/app/.venv/lib/python3.12/site-packages/joinly/server.py:ro
    #   - ./joinly/kokoro.py:/app/.venv/lib/python3.12/site-packages/joinly/services/tts/kokoro.py:ro
    #   - joinly-gpu-models:/home/app/.cache/huggingface

  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      SWITCHBOARD_DOMAIN: ${SWITCHBOARD_DOMAIN:?set SWITCHBOARD_DOMAIN to your DNS name}
    ports:
      - "80:80"        # Let's Encrypt's HTTP challenge, and the redirect to https
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # the certificates: keep them, or Let's Encrypt's rate limits bite
      - caddy-config:/config
    depends_on:
      switchboard:
        condition: service_healthy

volumes:
  switchboard-data:
  caddy-data:
  caddy-config:
