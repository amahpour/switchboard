 if(isInitial())return `<div class="evidence-layout"><div><div class="context-label">${badge(c.id,'blue')}<code>${d.revision}</code></div><h1 style="margin:12px 0">${esc(claimTitle(c))}</h1><p class="muted">Author-supplied evidence. The independent verdict is pending.</p><div class="proof-panel"><div class="proof-head"><strong>${esc(c.test)}</strong></div><div class="proof-content"><p class="muted">Source reference: ${esc(c.path)}. The reviewer will check the named test and inspect the code at this revision.</p></div></div></div><aside>${questionPanel()}</aside></div>`;
 return `${revisionNotice()}<div class="evidence-layout"><div><div class="context-label">${badge(c.id,main?'amber':'')}<span>${esc(d.repo)} · PR #${d.number}</span><code>evidence at ${evidenceRevision()}</code></div><h1 style="margin:12px 0 10px">${esc(claimTitle(c))}</h1><p class="muted">${esc(c.proof)}. ${main&&state.data==='real'?'The original absolute guarantee was not supported.':''}</p><div class="proof-panel"><div class="proof-head"><strong>${esc(shopAfter?'test_discount_after_tax':c.test)}</strong><span>Independent reviewer</span></div><div class="test-proof">${state.data==='real'?'Six cited files independently run at acee814:':'Illustrative shop checks:'}<br>${esc(d.testResult)}${main?`<br><br>Additional evidence:<br>${esc(d.probe).replace(/\n/g,'<br>')}`:''}</div></div>${main?`<div class="proof-panel"><div class="proof-head"><span>${state.data==='real'?'src/switchboard/mcp/codex_wake.py':'checkout/total.py'}</span><span>The lines behind this claim</span></div><div style="padding:12px 0">${codeLines.map(([ln,code])=>`<div class="code-line ${['120','128','41','42'].includes(ln)?'highlight':''}"><span class="ln">${ln}</span><span>${esc(code)}</span></div>`).join('')}</div><div class="code-note">${state.data==='real'?'Exact selected lines from acee814; lines 121–124 contain the join-proof branch. The status read and start are distinct calls.':shopAfter?'Fictional revised source. Discount now follows the tax calculation; affected checks were replayed in this illustrative snapshot.':'Fictional source at the initial revision. A different tax choice requires new code and evidence.'}</div></div>`:`<div class="proof-panel"><div class="proof-head"><span>${esc(c.path)}</span><span>at ${d.revision}</span></div><div class="proof-content"><h3>Evidence tied to this claim</h3><p class="muted">${esc(c.proof)}. The named test and source reference identify what was checked.</p>${btn('Explain this part of the change','tour','text')}</div></div>`}${main?`<div class="verdict"><strong>${state.data==='real'?'Checked with a limitation':state.answer?'Selected policy and calculation':'Calculation checked; intent unresolved'}</strong>${state.data==='real'?'The code refuses a wake based on the status snapshot. It does not make the read and start atomic. That uncertainty is Q4.':state.rechecked?'Illustrative later snapshot: the selected policy, offer, and receipt agree. This is not a real test run.':'This establishes what the initial code does. Q1 asks what customers should be promised.'}</div>`:''}</div><aside><h3>How this verdict changed</h3><div class="history-item"><span class="avatar">CC</span><div><strong>Author’s claim</strong><p>${state.data==='real'&&main?'Never start a turn during an approval wait.':esc(c.title)}</p></div></div><div class="history-item"><span class="avatar">CX</span><div><strong>Independent check</strong><p>${state.data==='real'&&main?'The listed tests passed. An additional probe exposed the gap they did not cover.':esc(c.proof)}</p></div></div>${state.phase==='verdict'?'':`<div class="history-item"><span class="avatar">CC</span><div><strong>Author’s response</strong><p>${main&&state.data==='real'?'Conceded; claim qualified. The real-daemon outcome remains unknown.':main?'Calculation is as written. The product choice goes to a person.':'Evidence checked at the pinned revision.'}</p></div></div>`}${main?`<div style="margin-top:25px">${btn('Open the decision','decision','primary')}</div>`:''}<div class="footer-note">${state.data==='real'?'Source record: actual dossier, verdicts, and the reproducible probe.':'Shop evidence is illustrative, not a recorded test run.'}</div>${state.data==='real'?'<a class="small" href="https://github.com/amahpour/switchboard/blob/01e199e4e44189fba44fc9a099bbb6fada5aaff9/docs/research/dossier-experiment.md" target="_blank" rel="noreferrer">Read the source record</a>':''}</aside></div>`;
}
function findingContent(){
 const d=current();const f=d.findings.find(x=>x.id===state.detail)||d.findings[0];const isQuestion=f.id==='F2';
 return `<div class="decision"><div class="context-label">${badge(f.id)}<span>${f.scope}</span><span>Owner: ${esc(f.owner)}</span></div><h1>${esc(f.title)}</h1><div class="callout" style="margin:22px 0"><h3>${esc(findingOutcome(f))}</h3><p style="margin-top:8px;font-size:14px">${isQuestion&&state.data==='real'?'The author conceded that the tests did not prove “never.” C2 was qualified to disclose the separate read and start. The real-daemon uncertainty remains Q4.':f.id==='F3'&&state.data==='real'?'The dossier now distinguishes the reviewed merge revision acee814 from the original PR head 61962cc.':f.id==='F1'&&state.data==='real'?'Numbered parts were used under the existing room limit. This belongs to the protocol trial, not a code finding in PR #64. The later command proposal, PR #82, is closed.':isQuestion?'The offer and invoice must make the same promise. A person’s choice creates work for the author and a recheck for the reviewer.':'The author corrected the receipt total. The reviewer checked it against the amount charged.'}</p></div>${btn(isQuestion?'Open the decision':'Back to the review',isQuestion?'decision':'review','primary')}<div class="footer-note">The record keeps the objection and concession after the finding is resolved.</div></div>`;
}
function tour(){
 const d=current();const i=Math.min(Math.max(state.stop,1),4)-1;const mapped=state.data==='real'?['C1','C4','C2','C8']:['C1','C3','C2','C4'];const c=d.claims.find(x=>x.id===mapped[i]);
 const descriptions=state.data==='real'?['A room message travels through the remote computer’s relay and MCP process to its own app-server. The broker does not wake a thread on the wrong computer.','The joined thread and verified process must match. The independent tests reject an unproven thread and malformed process checks.','The status is read immediately before start. The two calls leave a gap; the probe changes the fake to an approval wait inside it.','The new tier, report label, and join guidance are listed. Unchanged web files alone do not prove every page interaction unchanged.']:['Customers can apply a code at checkout. The visible result is the amount charged and the discount line on the receipt.','The code subtracts the discount and clamps at zero. Agents can test those concrete behaviors.','Before tax gives $86.40; after tax gives $88.00. The invoice rule and offer need one product decision.','The receipt must agree with the charge. The reviewer found a mismatch; the author fixed it and the reviewer rechecked it.'];
 return `${head()}<div class="tour"><nav>${d.tour.map((t,index)=>`<button class="tourstep ${index===i?'active':''}" data-action="stop:${index+1}"><span class="stepnum">${index+1}</span><span>${esc(t)}<span class="desc">${index===2?'A decision is open':'Claim and evidence'}</span></span></button>`).join('')}</nav><div class="tour-content"><div class="small muted" style="margin-bottom:8px">Stop ${i+1} of 4</div><h2>${esc(d.tour[i])}</h2><p>${esc(descriptions[i])}</p>${diagram(i===0?'pair':'after')}${i===2?`<div class="callout" style="margin-top:24px"><div class="row between"><h3>The reviewer’s objection at this step</h3>${badge(d.qid,'amber')}</div><p style="font-size:14px;margin:9px 0 12px">${esc(d.reviewReason)}</p>${btn('Inspect this evidence','claim:C2','text')}&nbsp;&nbsp;${btn('Compare the choices','decision','text')}</div>`:`<div class="proof-panel"><div class="proof-head"><span>${esc(c.id)} · ${esc(claimTitle(c))}</span></div><div class="proof-content"><p style="font-size:14px;margin-bottom:8px">${esc(c.proof)}</p>${btn('Inspect the evidence',`claim:${c.id}`,'text')}</div></div>`}<div class="tour-footer">${btn('Previous',`stop:${Math.max(1,i)}`,'',i===0)}<span class="small muted">Evidence follows the part you choose.</span>${btn(i===3?'Return to review':'Next stop',i===3?'review':`stop:${i+2}`,'primary')}</div></div></div>`;
}
function outgoingDrafts(){
 const d=current();const chosen=d.options.find(o=>o.id===state.answer);
 if(state.data==='real')return [
 {key:'author',owner:'Author · description update',avatar:'CC',text:`A remote Codex session can receive room messages through its own app-server when idle.\n\nReviewed merge revision: acee814. The status is read before turn/start; a change between those calls is not caught by the check. The real app-server’s behavior during an approval or input wait is unknown.\n\n${chosen?'Preview decision: '+chosen.label+'.':'Q4 remains open; this record is not settled.'}`},
 {key:'reviewer',owner:'Reviewer · one review comment',avatar:'CX',text:`I checked all eight claims at acee814 and independently ran the six cited files: 67 passed in 24.22s.\n\nC2’s original “never” guarantee was unsupported. A deterministic fake-daemon probe changed idle to waitingOnApproval between the read and start; turn/start was still sent. The author conceded and qualified the claim. This is not proof of real-daemon behavior.\n\n${chosen?'Preview decision: '+chosen.label+'. Real-daemon behavior remains unknown.':'Q4 requires a person’s decision.'}`},
 ...(state.answer==='followup'?[{key:'followup',owner:'Reviewer · follow-up issue draft',avatar:'CX',text:'Check real app-server behavior when turn/start arrives after an idle status read during an ordinary active turn, an approval wait, and an input wait. Record whether it refuses, queues, or accepts. This follow-up is a draft; no issue has been filed.'}]:[])];
 return [
 {key:'author',owner:'Author · description update',avatar:'CC',text:`Customers can apply a discount code at checkout. A discount cannot make the charge negative, and the receipt shows the amount charged.\n\n${chosen?'Selected policy: '+chosen.label+'. '+chosen.cost:'The tax policy is still open.'}\n\n${pendingFix()?'Changes and a reviewer recheck are still required.':state.rechecked?'Illustrative later snapshot: offer, calculation, and receipt checked after the choice.':'The receipt mismatch was corrected at the initial revision.'}`},
 {key:'reviewer',owner:'Reviewer · one batched review',avatar:'CX',text:`The initial calculation applied the discount before tax. I found a receipt total mismatch; the author fixed it and I rechecked it.\n\n${chosen?'Preview decision: '+chosen.label+'.':'Q1 remains open: the offer and invoice describe different promises.'}\n\n${pendingFix()?'Do not finish this review yet. The author must apply the selected policy and I must recheck the affected behavior.':state.rechecked?'Illustrative completed state: affected checks repeated on the revised example, and the offer and receipt agree.':'The policy requires a person’s decision.'}`}];
}
function outgoing(){
 const d=current(); const blocked=isInitial()||isStale()||state.phase==='verdict'||!state.answer||state.answer==='probe'&&state.data==='real'||pendingFix();
 const reason=isInitial()?'Wait for the independent check.':isStale()?'The affected claims need fresh evidence on the new revision.':state.phase==='verdict'?'The author’s response and reviewer’s recheck are pending.':!state.answer?'Answer the open question first.':pendingFix()?'The author must apply your choice, then the reviewer rechecks it. Use “Replay agent response” above to see the later illustrative snapshot.':blocked?'The required live probe has no evidence yet. Keep the review open.':'Review the exact drafts and their owners before authorizing anything.';
 return `${head()}<div class="outgoing-layout"><div><div class="section-title"><h2>What would leave the room</h2><span class="small muted">Editable preview drafts</span></div><div class="destination"><span>${esc(d.repo)} · PR #${d.number}</span><code>${revision()}</code></div>${outgoingDrafts().map(draft=>`<div class="post-owner"><div class="row"><span class="avatar">${draft.avatar}</span><strong>${draft.owner}</strong>${badge('Own account')}</div><textarea class="draft-text" data-draft="${draft.key}" aria-label="${esc(draft.owner)}" rows="${draft.key==='reviewer'?9:7}">${esc(state.drafts[draft.key]??draft.text)}</textarea></div>`).join('')}<div class="small muted">${state.data==='real'?'F1 (room length) and F3 (revision label) stay in the experiment record. They are not duplicate code comments on #64.':'Each finding is posted once by its owner. Dropped findings are omitted.'}</div></div><aside><div class="outgoing-action"><h2>${state.approved?'Preview authorization recorded':blocked?'The review is still open':'Review the drafts'}</h2><p>${reason}</p><ul class="checklist"><li>${isStale()?'<span class="muted">—</span>':icons.check}<span>${isStale()?'Two checks out of date':`Evidence tied to ${evidenceRevision()}`}</span></li><li>${icons.check}<span>Each outgoing item has one owner</span></li><li>${state.answer?icons.check:'<span class="muted">—</span>'}<span>${state.answer?'Preview decision recorded':'Decision still unanswered'}</span></li><li>${blocked?'<span class="muted">—</span>':icons.check}<span>${blocked?'Required work still pending':'Required work accounted for'}</span></li></ul>${btn(state.approved?'Preview authorized':'Authorize these preview drafts','approve','primary',blocked||state.approved)}<p class="notice">Preview only. ${state.data==='real'?'The real #64 record remains unanswered.':'The shop review is fictional.'}</p>${btn(state.answer?'Change the preview decision':'Open the decision','decision','text small')}</div><div class="footer-note">Proposed workflow: owners use their own platform tools after authorization. This view then shows posting receipts. It does not merge the PR.</div></aside></div>`;
}
function chrome(){
 const d=current();return `<div class="previewbar"><span class="previewlabel">Interactive design preview</span><label>Content <select id="dataset"><option value="real" ${state.data==='real'?'selected':''}>Last night’s real review</option><option value="shop" ${state.data==='shop'?'selected':''}>Simple shop example</option></select></label><div class="right">${pendingFix()?btn('Replay agent response','replay','replay'):state.rechecked?'<span class="small muted">Illustrative recheck complete</span>':''}<label>Moment <select id="phase"><option value="initial" ${state.phase==='initial'?'selected':''}>Dossier ready</option><option value="verdict" ${state.phase==='verdict'?'selected':''}>Reviewer’s check</option><option value="round" ${state.phase==='round'?'selected':''}>Author’s round</option><option value="stale" ${state.phase==='stale'?'selected':''}>New revision (simulated)</option></select></label>${btn(state.theme==='light'?'Dark':'Light','theme','text small')}</div></div><header class="topbar"><div class="brand">${icons.brand}<span>switchboard</span></div><div class="breadcrumb"><span>Changes</span><span>/</span><span>${esc(d.repo)} #${d.number}</span></div><div class="right"><span class="small muted people">Claude Code + Codex</span>${badge(isInitial()?'Checking':isStale()?'2 checks out of date':state.answer?'Preview answer':'1 decision',isInitial()||state.answer?'blue':'amber')}</div></header><nav class="tabs" aria-label="Review views">${btn('Overview','overview',state.view==='overview'?'active':'')}${btn('Review','review',state.view==='review'||state.view==='evidence'||state.view==='finding'?'active':'')}${btn(`Decisions <span class="tab-count">${questionCount()}</span>`,'inbox',state.view==='inbox'||state.view==='decision'?'active':'')}</nav>`;
}
function render(){
 document.documentElement.dataset.theme=state.theme;
 const pages={review,overview,inbox,decision:decisionContent,evidence:evidenceContent,finding:findingContent,tour,outgoing};
 document.getElementById('app').innerHTML=chrome()+`<main>${(pages[state.view]||review)()}</main>`;
 document.getElementById('dataset').addEventListener('change',event=>{state.data=event.target.value;state.answer='';state.selected='';state.approved=false;state.rechecked=false;state.drafts={};render()});
 document.getElementById('phase').addEventListener('change',event=>{state.phase=event.target.value;state.answer='';state.selected='';state.approved=false;state.rechecked=false;state.drafts={};render()});
 document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>act(el.dataset.action)));
 document.querySelectorAll('[data-draft]').forEach(el=>el.addEventListener('input',()=>{state.drafts[el.dataset.draft]=el.value;if(state.approved){state.approved=false;const button=document.querySelector('[data-action=approve]');button.disabled=false;button.textContent='Authorize these preview drafts';document.querySelector('.outgoing-action h2').textContent='Draft edited; authorization needed'}}));
 const url=new URL(location.href);const values={view:state.view,case:state.data,phase:state.phase,theme:state.theme,choice:state.selected,answer:state.answer,stop:state.stop,item:state.detail,expanded:state.expanded?'1':'',rechecked:state.rechecked?'1':''};
 for(const [key,value] of Object.entries(values)){if(value)url.searchParams.set(key,value);else url.searchParams.delete(key)}
 history.replaceState(null,'',url);
}
function act(action){
 const [name,value]=action.split(':');
 if(name==='theme'){state.theme=state.theme==='light'?'dark':'light';render();return}
 if(name==='expand'){state.expanded=!state.expanded;render();return}
 if(name==='option'){state.selected=value;render();return}
 if(name==='save-decision'){if(!state.selected||isStale())return;state.answer=state.selected;state.approved=false;state.rechecked=false;state.drafts={};state.view='outgoing'}
 else if(name==='replay'){state.rechecked=true;state.approved=false;state.drafts={};state.view='outgoing'}
 else if(name==='approve'){state.approved=true;render();return}
 else if(name==='claim'){state.detail=value;state.view='evidence'}
 else if(name==='finding'){state.detail=value;state.view='finding'}
 else if(name==='stop'){state.stop=Number(value);state.view='tour'}
 else state.view=name;
 render();window.scrollTo(0,0);
}
window.prototype={state,act,render};
render();

</script>
</body>
